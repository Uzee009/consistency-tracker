# .github/workflows/build_reusable.yml
name: Reusable Flutter Build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: 'The platform to build for (macos, linux, windows)'
      output_name:
        required: true
        type: string
        description: 'The name to use for the output artifact'

jobs:
  build:
    runs-on: ${{ (inputs.platform == 'macos' && 'macos-13') || (inputs.platform == 'linux' && 'ubuntu-24.04') || (inputs.platform == 'windows' && 'windows-2022') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.4'
          cache: true

      - name: Install Dependencies
        run: |
          if [ "${{ inputs.platform }}" == "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev liblzma-dev libglu1-mesa-dev ninja-build pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          fi
          flutter pub get
        shell: bash

      - name: Build ${{ inputs.platform }}
        run: flutter build ${{ inputs.platform }} --release

      - name: Package macOS (DMG)
        if: inputs.platform == 'macos'
        run: |
          mkdir -p dist
          cp -r build/macos/Build/Products/Release/*.app dist/
          hdiutil create -volname "Consistency Tracker" -srcfolder dist -ov -format UDZO "${{ inputs.output_name }}.dmg"
        shell: bash

      - name: Package Linux (Tarball)
        if: inputs.platform == 'linux'
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "../../../../../${{ inputs.output_name }}.tar.gz" .
        shell: bash

      - name: Package Windows (Zip)
        if: inputs.platform == 'windows'
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "${{ inputs.output_name }}.zip"
        shell: pwsh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            *.dmg
            *.tar.gz
            *.zip
