name: Build and Release Application

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build_macos:
    uses: ./.github/workflows/build_reusable.yml
    with:
      platform: macos
      output_name: ConsistencyTracker-macOS

  build_linux:
    uses: ./.github/workflows/build_reusable.yml
    with:
      platform: linux
      output_name: ConsistencyTracker-Linux

  build_windows:
    uses: ./.github/workflows/build_reusable.yml
    with:
      platform: windows
      output_name: ConsistencyTracker-Windows

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_macos, build_linux, build_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ConsistencyTracker-macOS/ConsistencyTracker-macOS.dmg
            ConsistencyTracker-Linux/ConsistencyTracker-Linux.tar.gz
            ConsistencyTracker-Windows/ConsistencyTracker-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
