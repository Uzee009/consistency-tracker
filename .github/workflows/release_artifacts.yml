name: Build and Release Application

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  build_macos:
    needs: analyze
    uses: ./.github/workflows/build_reusable.yml
    with:
      platform: macos
      output_name: ConsistencyTracker-macOS

  build_linux:
    needs: analyze
    uses: ./.github/workflows/build_reusable.yml
    with:
      platform: linux
      output_name: ConsistencyTracker-Linux

  build_windows:
    needs: analyze
    uses: ./.github/workflows/build_reusable.yml
    with:
      platform: windows
      output_name: ConsistencyTracker-Windows

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, build_macos, build_linux, build_windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ConsistencyTracker-macOS/ConsistencyTracker-macOS.dmg
            ConsistencyTracker-Linux/ConsistencyTracker-Linux.tar.gz
            ConsistencyTracker-Windows/ConsistencyTracker-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
