name: Build Windows App

on:
  repository_dispatch:
    types: [release_created]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Grant write permissions for uploading release assets

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          enable-windows: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive Windows Executable
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "consistency-tracker-windows-${{ github.event.client_payload.tag }}.zip"
        shell: pwsh # Use PowerShell for Compress-Archive

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.client_payload.release_id }}/assets{?name}
          asset_path: consistency-tracker-windows-${{ github.event.client_payload.tag }}.zip
          asset_name: consistency-tracker-windows-${{ github.event.client_payload.tag }}.zip
          asset_content_type: application/zip