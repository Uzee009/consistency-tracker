name: Build Linux App

on:
  repository_dispatch:
    types: [release_created]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq # Ubuntu-specific installation

      - name: Parse Release Info
        id: parse_release
        run: |
          echo "RELEASE_ID=$(jq -r '.client_payload.release_id' "$GITHUB_EVENT_PATH")" >> $GITHUB_ENV
          echo "TAG=$(jq -r '.client_payload.tag' "$GITHUB_EVENT_PATH")" >> $GITHUB_ENV
        shell: bash

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          enable-linux: true
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Install GTK Development Libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Verify GTK Installation
        run: pkg-config --modversion gtk+-3.0

      - name: Build Linux
        run: flutter build linux --release
        
      - name: Archive Linux Bundle
        run: |
          zip -r consistency-tracker-linux-${{ env.TAG }}.zip build/linux/x64/release/bundle/
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets{?name}
          asset_path: consistency-tracker-linux-${{ env.TAG }}.zip
          asset_name: consistency-tracker-linux-${{ env.TAG }}.zip
          asset_content_type: application/zip