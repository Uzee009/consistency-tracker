name: Build Linux App

on:
  repository_dispatch:
    types: [release_created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant write permissions for uploading release assets
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          enable-linux: true
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release
        
      - name: Archive Linux Bundle
        run: |
          zip -r consistency-tracker-linux-${{ github.event.client_payload.tag }}.zip build/linux/x64/release/bundle/
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.client_payload.release_id }}/assets{?name}
          asset_path: consistency-tracker-linux-${{ github.event.client_payload.tag }}.zip
          asset_name: consistency-tracker-linux-${{ github.event.client_payload.tag }}.zip
          asset_content_type: application/zip